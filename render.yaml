services:
  - type: web
    name: ai-agent-network-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MOCK_LLM_MODE
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./agent_network.db"
