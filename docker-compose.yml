version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_network_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agent_network
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_network"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Background Queue / Streams
  redis:
    image: redis:7-alpine
    container_name: agent_network_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend API & Routing Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_network_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/agent_network
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      ROUTING_VECTOR_TOP_K: "50"
      ROUTING_RELEVANCE_THRESHOLD: "0.75"
      AI_PROVIDER: "mock" # Or "anthropic" / "openai" / "gemini"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    ports:
      - "8000:8000"

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_network_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

